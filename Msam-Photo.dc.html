<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%;min-height:160px;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(135deg,#eceae5 0 14px,#f5f4f1 14px 28px);display:flex;align-items:center;justify-content:center;box-sizing:border-box;">
  <div style="position:absolute;inset:0;background:radial-gradient(circle at 78% 18%, rgba(255,122,0,0.07), transparent 55%), radial-gradient(circle at 12% 88%, rgba(123,31,162,0.07), transparent 55%);"></div>
  <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px;">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#a9a59c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span style="font-family:'IBM Plex Mono','Courier New',monospace;font-size:12px;letter-spacing:0.01em;color:#8c887e;direction:rtl;line-height:1.5;max-width:240px;">{{ label }}</span>
  </div>
  <div style="position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#FF7A1A,#FFC107,#FF1E3C,#E91E8C,#7B1FA2);"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:240},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;صورة المنتج&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
