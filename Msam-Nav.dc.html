    .msam-nav-toggle-input:checked ~ .msam-nav-row [data-nav-links]{transform:translateY(0);opacity:1;pointer-events:auto;}
    [data-nav-links] a:not(.msam-nav-cta-mobile){padding:14px 2px !important;border-bottom:1px solid #f2f1ec;font-size:16.5px !important;width:100%;}
    [data-nav-cta]{display:none !important;}
    .msam-nav-cta-mobile{display:flex !important;margin-top:14px;width:100%;justify-content:center;padding:14px 22px !important;}
    .msam-nav-backdrop{display:block;position:fixed;inset:0;z-index:35;background:rgba(21,19,31,0.32);opacity:0;pointer-events:none;transition:opacity .2s;}
    .msam-nav-toggle-input:checked ~ .msam-nav-backdrop{opacity:1;pointer-events:auto;}
    .msam-nav{padding:14px clamp(16px,4vw,40px) !important;}
  }
  @media (max-width:380px){
    .msam-nav-logo-en{display:none;}
  }

<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;products&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'home';
    return {
      isHome: a === 'home',
      isProducts: a === 'products',
